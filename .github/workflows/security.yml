# =============================================================================
# SimpleAuth — Security: dependency vulnerability scanning
# =============================================================================
# Runs govulncheck (the official Go vulnerability scanner) against the server
# and the Go SDK. SimpleAuth is an auth server, so a known-vulnerable dependency
# is a security bug — this gate is intentionally blocking. Also runs weekly so a
# newly-disclosed CVE in a pinned dependency surfaces even without a code change.
# =============================================================================

name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Default to no permissions; the scan job opts into the least it needs.
permissions: {}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan server module
        run: govulncheck ./...

      - name: Scan Go SDK module
        working-directory: sdk/go
        run: govulncheck ./...
