# =============================================================================
# SimpleAuth — CodeQL static analysis
# =============================================================================
# GitHub's SAST engine. Analyzes the Go server and the JavaScript/TypeScript SDK
# for security issues (injection, auth bugs, unsafe patterns). Results appear in
# the repository's Security → Code scanning tab. Also runs weekly.
# =============================================================================

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

# Default to no permissions; the analyze job opts into the least it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
      actions: read # required by CodeQL on private repos
      security-events: write # upload scanning results
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Analyze
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
