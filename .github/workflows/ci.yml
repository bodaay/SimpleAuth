# =============================================================================
# SimpleAuth — CI: Build & Test
# =============================================================================
# Runs on every push and pull request. Validates that the Go code compiles,
# tests pass, and the Docker image builds successfully.
# =============================================================================

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Default to no permissions; each job opts into the least it needs.
permissions: {}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Test (race detector)
        run: go test -race ./...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build Docker image
        run: docker build -t simpleauth:ci .
