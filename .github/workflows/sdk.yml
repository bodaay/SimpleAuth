# =============================================================================
# SimpleAuth — SDK build & test (Go, Python, JavaScript/TS, .NET)
# =============================================================================
# Each SDK is its own job so one failing doesn't mask the others. Go, Python, and
# JS/TS are validated and gating. .NET is gating too (sources compile against
# net8.0 with the AspNetCore framework reference); CI runs its first real build.
# =============================================================================

name: SDKs

on:
  push:
    branches: [master]
    paths: ["sdk/**", ".github/workflows/sdk.yml"]
  pull_request:
    branches: [master]
    paths: ["sdk/**", ".github/workflows/sdk.yml"]
  workflow_dispatch:

# Default to no permissions; each job opts into the least it needs.
permissions: {}

jobs:
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: sdk/go/go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Test (if any)
        run: go test ./... 2>/dev/null || echo "no Go SDK tests"

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ./sdk/python
      - name: Import smoke test
        run: python -c "import simpleauth; print('simpleauth', getattr(simpleauth, '__version__', 'ok'))"

  js-sdk:
    name: JS/TS SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - run: npm install
      - name: Type-check
        run: npm run typecheck

  dotnet-sdk:
    name: .NET SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build sdk/dotnet/SimpleAuth.csproj -c Release
