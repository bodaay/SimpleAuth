# =============================================================================
# SimpleAuth — SDK build & test (Go, Python, JavaScript/TS, .NET)
# =============================================================================
# Each SDK is its own job so one failing doesn't mask the others. Go, Python, and
# JS/TS are validated and gating. .NET is gating too (sources compile against
# net8.0 with the AspNetCore framework reference); CI runs its first real build.
# =============================================================================

name: SDKs

on:
  push:
    branches: [master]
    paths: ["sdk/**", ".github/workflows/sdk.yml"]
  pull_request:
    branches: [master]
    paths: ["sdk/**", ".github/workflows/sdk.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/go
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - run: go build ./...
      - run: go vet ./...
      - name: Test (if any)
        run: go test ./... 2>/dev/null || echo "no Go SDK tests"

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ./sdk/python
      - name: Import smoke test
        run: python -c "import simpleauth; print('simpleauth', getattr(simpleauth, '__version__', 'ok'))"

  js-sdk:
    name: JS/TS SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - run: npm install
      - name: Type-check
        run: npm run typecheck

  dotnet-sdk:
    name: .NET SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build sdk/dotnet/SimpleAuth.csproj -c Release
